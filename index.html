<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration — Master’s Toronto Satsang Program</title>
<style>
  :root { --ink: #16282b; --soft: #4c6064; --accent: #0b5563; --accent-dk: #083f4a; --tint: #e7f0f1; --line: #b8c8cb; --hair: #dfe8e9; --pale: #f4f8f8; --err: #b3121a; --ok: #0a6b3c; --warn: #9a5b00; --warn-bg: #fff6e5; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: #eef2f3; font-size: 16px; line-height: 1.4; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 680px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .preview { background: #fff3cd; color: #6b4b00; font-size: 12.5px; font-weight: 600; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f0d98a; }
  .preview b { font-weight: 800; }

  /* ---------- header + progress ---------- */
  .top { background: #fff; padding: 14px 20px 10px; border-bottom: 3px solid var(--accent); }
  .top .kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent); }
  .top h1 { margin: 0; font-size: 20px; line-height: 1.15; }
  .top .dates { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .progress { display: flex; gap: 6px; margin-top: 12px; }
  .progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--hair); }
  .progress span.done { background: var(--accent); }
  .progress span.cur { background: var(--accent); opacity: .55; }
  .stepname { font-size: 13px; color: var(--soft); margin-top: 6px; display: flex; justify-content: space-between; }

  /* ---------- content ---------- */
  main { flex: 1; padding: 16px 16px 110px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 18px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px; }
  h2 { margin: 0 0 4px; font-size: 19px; display: flex; align-items: center; gap: 9px; }
  h2 .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .hint { color: var(--soft); font-size: 14px; margin: 0 0 14px; }
  .note { background: var(--tint); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
  .note.warn { background: var(--warn-bg); border-color: var(--warn); }
  .note.err { background: #fdeeee; border-color: var(--err); }
  .note b { color: var(--ink); }

  .f { margin-bottom: 14px; }
  .f label, .f .lbl { display: block; font-size: 13px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--soft); margin-bottom: 5px; }
  .f label .req { color: var(--err); }
  .in { width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font-size: 17px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,85,99,.18); }
  .f.bad .in { border-color: var(--err); }
  .f.good .in { border-color: var(--ok); }
  .msg { font-size: 13px; margin-top: 5px; min-height: 0; }
  .msg.warn { color: var(--warn); }
  .f.bad .msg { color: var(--err); }
  .f.good .msg::before { content: "✓ "; color: var(--ok); }
  .f.good .msg { color: var(--ok); }
  select.in { appearance: none; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%234c6064' stroke-width='2'/></svg>") no-repeat right 14px center; padding-right: 36px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

  /* segmented choice (Yes/No, Mr/Ms) */
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; height: 46px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 3px solid rgba(11,85,99,.35); }
  .f.bad .seg button { border-color: var(--err); }

  /* number stepper */
  .stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; width: 140px; flex: none; background: #fff; }
  .stepper button { width: 44px; height: 46px; border: 0; background: var(--pale); font-size: 22px; cursor: pointer; color: var(--accent); }
  .stepper button:disabled { color: #b9c5c7; }
  .stepper input { flex: 1; width: 40px; height: 46px; border: 0; text-align: center; font-size: 18px; font-weight: 600; outline: none; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .srow:first-of-type { border-top: 0; }
  .srow .t { font-size: 16px; flex: 1; min-width: 0; }
  .srow .t small { display: block; color: var(--soft); font-size: 13px; }
  .subtotal { display: flex; justify-content: space-between; padding: 12px 14px; background: var(--tint); border-radius: 9px; font-weight: 700; margin-top: 10px; }
  .grp-title { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--accent); margin: 16px 0 4px; }

  /* option cards */
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 11px; padding: 13px 14px; background: #fff; cursor: pointer; text-align: left; width: 100%; }
  .opt.on { border-color: var(--accent); background: var(--tint); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; position: relative; }
  .opt.on .radio { border-color: var(--accent); }
  .opt.on .radio::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); }
  .opt .t { font-weight: 700; font-size: 16px; }
  .opt .d { font-size: 13.5px; color: var(--soft); margin-top: 2px; }
  .opt.soon { opacity: .55; cursor: not-allowed; }
  .opt .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; background: var(--hair); color: var(--soft); border-radius: 6px; padding: 2px 7px; margin-left: 6px; vertical-align: 1px; }
  .branch { margin: 12px 0 6px 0; padding: 14px 14px 2px; border-left: 3px solid var(--accent); background: var(--pale); border-radius: 0 9px 9px 0; }

  /* time chips + bus */
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { height: 42px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.off { color: #b9c5c7; text-decoration: line-through; background: var(--pale); cursor: not-allowed; }
  .pk { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; margin-left: 8px; vertical-align: 1px; }
  .pk.yes { color: var(--ok); } .pk.no { color: var(--err); }
  .pk svg { width: 15px; height: 15px; }
  .price { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .total { display: flex; justify-content: space-between; align-items: center; background: var(--accent); color: #fff; border-radius: 10px; padding: 14px 16px; font-size: 17px; font-weight: 700; }
  .total small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
  .sum { border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .sum div { display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--hair); font-size: 15px; }
  .sum div:first-child { border-top: 0; }
  .sum div.g { background: var(--tint); font-weight: 700; font-size: 17px; }
  .sum .ref { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; margin-right: 8px; }
  .opt .t .price { float: right; }

  /* day card */
  .day { border: 1.5px solid var(--line); border-radius: 11px; padding: 14px; margin-bottom: 12px; }
  .day .dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .day .dh b { font-size: 17px; }
  .day .dh .seg { width: 170px; }
  .day .body { margin-top: 12px; }
  .day.off .body { display: none; }

  /* review */
  .rv { border-top: 1px solid var(--hair); padding: 10px 0; display: grid; grid-template-columns: 42% 1fr; gap: 8px; font-size: 15px; }
  .rv:first-child { border-top: 0; }
  .rv .k { color: var(--soft); }
  .rv .v { font-weight: 600; }
  .rv .v.empty { color: var(--err); font-weight: 500; }
  .edit { float: right; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; }
  .check { list-style: none; padding: 0; margin: 0; }
  .check li { padding: 6px 0 6px 26px; position: relative; font-size: 15px; }
  .check li::before { content: "✕"; position: absolute; left: 4px; color: var(--err); font-weight: 700; }
  .check li a { color: var(--accent); }
  .allgood { color: var(--ok); font-weight: 700; }

  /* bottom nav */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--hair); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .nav .inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { height: 50px; border-radius: 10px; border: 1.5px solid var(--accent); background: #fff; color: var(--accent); font-size: 16px; font-weight: 700; padding: 0 20px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; flex: 1; }
  .btn.primary:hover { background: var(--accent-dk); }
  .btn.ghost { border-color: transparent; color: var(--soft); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .draft { font-size: 12px; color: var(--soft); text-align: center; margin-top: 6px; }

  /* restore banner */
  .banner { background: var(--warn-bg); border: 1px solid #f0d9a8; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner .btn { height: 38px; padding: 0 14px; font-size: 14px; }

  /* ---------- print sheet ---------- */
  #sheet { display: none; }
  @media print {
    @page { size: 8.5in 11in; margin: .4in .5in; }
    body { background: #fff; font-size: 9.5pt; line-height: 1.3; }
    .app { display: none !important; }
    #sheet { display: block; color: #000; }
    .ph { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.25pt solid var(--accent); padding-bottom: 4pt; margin-bottom: 6pt; }
    .ph .kicker { font-size: 8pt; font-weight: 700; letter-spacing: 1.5pt; text-transform: uppercase; color: var(--accent); }
    .ph h1 { margin: 0; font-size: 15pt; }
    .ph .dates { font-size: 10.5pt; font-weight: 600; }
    .ph .contact { font-size: 8.5pt; text-align: right; color: var(--soft); }
    .ps { margin-bottom: 6pt; break-inside: avoid; }
    .ps h3 { margin: 0 0 2pt; font-size: 8pt; font-weight: 700; letter-spacing: 1pt; text-transform: uppercase; color: var(--accent); border-bottom: .75pt solid var(--hair); padding-bottom: 2pt; }
    .pr { display: grid; grid-template-columns: 2in 1fr; gap: 1pt 10pt; font-size: 9.5pt; padding: 1pt 0; }
    .pr .k { color: var(--soft); }
    .pr .v { font-weight: 600; }
    table.pt { width: 100%; border-collapse: collapse; font-size: 9pt; margin-top: 2pt; }
    table.pt th, table.pt td { border: .75pt solid var(--line); padding: 2pt 5pt; text-align: center; }
    table.pt th { background: var(--tint); font-size: 8pt; }
    table.pt td:first-child, table.pt th:first-child { text-align: left; font-weight: 600; white-space: nowrap; }
    .pbox { border: .75pt solid var(--line); border-radius: 4pt; padding: 4pt 8pt; font-size: 9.5pt; }
    .sig { display: grid; grid-template-columns: 2.2fr 1fr; gap: 12pt; margin-top: 7pt; }
    .sig .b { border: 1.2pt solid #000; border-radius: 3pt; height: 26pt; position: relative; }
    .sig .b span { position: absolute; right: 6pt; bottom: 3pt; font-size: 9pt; color: var(--soft); }
    .sig .l { font-size: 8pt; font-weight: 700; letter-spacing: .6pt; text-transform: uppercase; color: var(--soft); margin-bottom: 2pt; }
    .legal { display: grid; grid-template-columns: 1fr .85fr 1.4fr; gap: 10pt; font-size: 6.3pt; line-height: 1.2; color: #2c3e41; margin-top: 6pt; border-top: .75pt solid var(--hair); padding-top: 4pt; }
    .legal b { display: block; font-size: 7pt; letter-spacing: .6pt; text-transform: uppercase; color: #000; margin-bottom: 1pt; }
    .admin { border: 1pt dashed var(--line); border-radius: 4pt; padding: 4pt 9pt 6pt; margin-top: 7pt; background: #fafcfc; font-size: 8pt; break-inside: avoid; }
    .admin .cap { font-weight: 700; letter-spacing: 1pt; text-transform: uppercase; }
    .admin .grid { display: grid; grid-template-columns: 1.4fr 1.3fr 1.3fr 1.8fr auto auto; gap: 8pt; margin-top: 4pt; }
    .admin .grid div { font-size: 7pt; font-weight: 700; letter-spacing: .5pt; text-transform: uppercase; color: var(--soft); }
    .admin .grid i { display: block; height: 15pt; border: .75pt solid var(--line); border-radius: 3pt; background: #fff; margin-top: 2pt; }
    .admin .grid .cb { display: block; width: 13pt; height: 13pt; border: 1.2pt solid #000; border-radius: 2.5pt; margin-top: 4pt; }
    .pfoot { display: flex; justify-content: space-between; font-size: 7pt; color: var(--soft); margin-top: 5pt; }
  }
</style>
</head>
<body>

          ${c.parking ? srow("Cars parking at " + (busLoc() ? busLoc().name.split(": ").pop() : o.name), "set to 0 if you are being dropped off", stepper(`bus.days.${i}.cars`, "bk" + i, bd.cars || 0, 0, 5)) : ""}
          <div class="msg">${bad("bk" + i) ? esc(errs["bk" + i]) : ""}</div>
          ${!bad("bk" + i) && bd.tickets >= 1 && bd.tickets !== dayTotal(d) ? `<div class="msg warn">⚠ ${bd.tickets} ticket${bd.tickets === 1 ? "" : "s"} but ${dayTotal(d)} member${dayTotal(d) === 1 ? "" : "s"} listed for this day. Everyone travelling by bus needs a ticket — please check Section 2 or the number of tickets.</div>` : ""}</div>
        <div class="subtotal"><span>Bus total for this day</span><span>${money(busDayTotal(i))}</span></div>
      </div>`; }).join("");
      html += `<div class="total"><span>Bus total<small>${esc(c.name)} · roundtrip, non-refundable</small></span><span>${money(busGrand())}</span></div>`;
    }
    return html;
  },
  food(errs) {
    const T = DATA.teaLunch, bad = S.touched.pay && errs.pay, total = grandTotal();
    const line = (k, v, cls = "") => `<div class="${cls}"><span>${k}</span><span>${v}</span></div>`;
    return `<div class="card">
      <h2><span class="num">9</span>Tea &amp; packed lunch</h2>
      <p class="hint">Optional. Order for each day you are attending. ${esc(T.note)}</p>
      ${S.days.map((d, i) => !d.attending ? "" : `<div class="day"><div class="dh"><b>${esc(dayName(E.days[i]))}</b><span class="hint" style="margin:0">${dayTotal(d)} member${dayTotal(d) === 1 ? "" : "s"}</span></div><div class="body">
        ${srow("Tea", `${esc(T.teaHint)} · ${money(T.teaPrice)} each`, stepper(`food.days.${i}.tea`, "food", S.food.days[i].tea, 0, 60))}
        ${srow("Packed lunch", `${esc(T.lunchHint)} · ${money(T.lunchPrice)} each`, stepper(`food.days.${i}.lunch`, "food", S.food.days[i].lunch, 0, 60))}
        <div class="subtotal"><span>Tea &amp; lunch for this day</span><span>${money(foodDayTotal(i))}</span></div></div></div>`).join("")}
    </div>
    <div class="card">
      <h2><span class="num">10</span>Total payment</h2>
      <p class="hint">Payment is made at your local Satsang Centre when you hand in the printed form.</p>
      <div class="sum">
        ${S.transport.mode === "shuttle" ? line(`<span><span class="ref">A</span>Bus tickets</span>`, money(busA())) : ""}
        ${line(`<span><span class="ref">B</span>Tea &amp; packed lunch</span>`, money(foodGrand()))}
        ${line("Total payment enclosed", money(total), "g")}
      </div>
      ${total > 0 ? `<div class="f ${bad ? "bad" : ""}" data-f="pay"><label>Paying by <span class="req">*</span></label>
        ${seg("pay.method", "pay", [{ v: "cash", l: "Cash" }, { v: "cheque", l: "Cheque" }], S.pay.method)}
        <div class="msg">${bad ? esc(errs.pay) : S.pay.method === "cheque" ? `Cheque payable to <b>${esc(DATA.chequePayableTo)}</b>` : ""}</div></div>`
      : `<div class="note">Nothing to pay — you have not ordered bus tickets, tea or lunch.</div>`}
    </div>`;
  },
  review() {
    const errs = allErrors(), c = S.contact, n = S.needs, t = S.transport;
    const issues = Object.entries(errs);
    const stepOf = k => /^(title|first|last|phone|city|province|postal)$/.test(k) ? 0 : /^(att|cnt)/.test(k) ? 1 : /^(translation|hearing|special)$/.test(k) ? 2 : /^(bus|bt|bk)/.test(k) ? stepIndex("bus") : k === "pay" ? stepIndex("food") : 3;
    const row = (k, v, empty) => `<div class="rv"><span class="k">${k}</span><span class="v ${empty ? "empty" : ""}">${v}</span></div>`;
    const yn = v => v === null ? "—" : v ? "Yes" : "No";
    const opt = T => (T.options.find(o => o.key === t.mode) || {}).label || "—";
    const reason = (DATA.transport.parkReasons.find(r => r.key === t.parkReason) || {}).label || "—";
    return `${issues.length ? `<div class="card"><h2 style="color:var(--err)">Please fix ${issues.length} item${issues.length > 1 ? "s" : ""} before printing</h2>
        <ul class="check">${issues.map(([k, m]) => `<li><a href="#" data-goto="${stepOf(k)}" data-focus="${k}">${esc(m)}</a></li>`).join("")}</ul></div>`
      : `<div class="card"><p class="allgood" style="margin:0">✓ Everything looks complete. Print this form (or save it as a PDF), sign it, and hand it in at your local Satsang Centre.</p></div>`}
      <div class="card"><h2>1 &nbsp;Contact <button class="edit" data-goto="0">Edit</button></h2>
        ${row("Name", esc([c.title, c.first, c.last].filter(Boolean).join(" ")) || "—", !c.first)}
        ${row("Phone", esc(c.phone) || "—", !c.phone)}
        ${row("Address", esc([c.city, c.province, c.postal].filter(Boolean).join(", ")) || "—", !c.city)}
      </div>
      <div class="card"><h2>2 &nbsp;Attending <button class="edit" data-goto="1">Edit</button></h2>
        ${S.days.map((d, i) => row(esc(dayName(E.days[i])), d.attending === null ? "—" : d.attending ? `${dayTotal(d)} member${dayTotal(d) === 1 ? "" : "s"} <span style="font-weight:400;color:var(--soft)">(Family Area ${kids(d) + d.fag}, Venue ${d.venue})</span>` : "Not attending", d.attending === null)).join("")}
      </div>
      <div class="card"><h2>3–5 &nbsp;Seating needs <button class="edit" data-goto="2">Edit</button></h2>
        ${row("Translation", n.translation ? `Yes — ${n.en} English, ${n.fr} French` : yn(n.translation), n.translation === null)}
        ${row("Hearing assistance", n.hearing ? `Yes — ${n.hearingN}` : yn(n.hearing), n.hearing === null)}
        ${row("Special needs", n.special ? `Yes — ${n.specialN}` : yn(n.special), n.special === null)}
      </div>
      <div class="card"><h2>6 &nbsp;Transportation <button class="edit" data-goto="3">Edit</button></h2>
        ${row("Option", esc(opt(DATA.transport)), !t.mode)}
        ${t.mode === "park" ? row("Reason", esc(reason), !t.parkReason) + row("Parking spots", t.parkSpots) : ""}
        ${t.mode === "taxi" ? row("Drop-off address", DATA.transport.dropOff.address.map(esc).join("<br>")) : ""}
      </div>
      ${t.mode === "shuttle" ? (() => { const bc = busChoice(); return `<div class="card"><h2>7 &nbsp;Bus tickets <button class="edit" data-goto="${stepIndex("bus")}">Edit</button></h2>
        ${row("Departure", bc ? esc(bc.name) : "—", !bc)}
        ${S.days.map((d, i) => !d.attending ? "" : row(esc(dayName(E.days[i])), S.bus.days[i].time ? `${S.bus.days[i].time} AM · ${S.bus.days[i].tickets} ticket${S.bus.days[i].tickets === 1 ? "" : "s"}${bc && bc.parking ? ` · ${S.bus.days[i].cars} car${S.bus.days[i].cars === 1 ? "" : "s"}` : ""}` : "—", !S.bus.days[i].time)).join("")}
        ${row("Bus total", money(busGrand()))}
      </div>`; })() : ""}
      <div class="card"><h2>9–10 &nbsp;Tea, lunch &amp; payment <button class="edit" data-goto="${stepIndex("food")}">Edit</button></h2>
        ${S.days.map((d, i) => !d.attending ? "" : row(esc(dayName(E.days[i])), S.food.days[i].tea + S.food.days[i].lunch ? `${S.food.days[i].tea} tea · ${S.food.days[i].lunch} lunch` : "None")).join("")}
        ${row("Total payment", `<b>${money(grandTotal())}</b>` + (S.transport.mode === "shuttle" ? ` <span style="font-weight:400;color:var(--soft)">(bus ${money(busA())} + tea &amp; lunch ${money(foodGrand())})</span>` : ""))}
        ${grandTotal() > 0 ? row("Paying by", S.pay.method ? (S.pay.method === "cash" ? "Cash" : "Cheque") : "—", !S.pay.method) : ""}
      </div>`;
  }
};

/* =====================================================================
   PRINT SHEET
   ===================================================================== */
function renderSheet() {
  const c = S.contact, n = S.needs, t = S.transport, A = DATA.attendance;
  const opt = (DATA.transport.options.find(o => o.key === t.mode) || {}).label || "";
  const reason = (DATA.transport.parkReasons.find(r => r.key === t.parkReason) || {}).label || "";
  const pr = (k, v) => `<div class="pr"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const yn = v => v ? "Yes" : "No";
  $("#sheet").innerHTML = `
    <div class="ph"><div><div class="kicker">Registration Form</div><h1>${esc(E.title)}</h1><div class="dates">${esc(dayName(D1))} &amp; ${esc(dayName(D2))} ${esc(E.year)}</div></div>
      <div class="contact">For additional information<br><b>${esc(E.website)}</b><br><b>${esc(E.phone)}</b></div></div>
    <div class="ps"><h3>1. Primary contact person</h3>
      ${pr("Name", esc([c.title, c.first, c.last].filter(Boolean).join(" ")))}${pr("Phone", esc(c.phone))}${pr("City / Province / Postal", esc([c.city, c.province, c.postal].filter(Boolean).join(", ")))}</div>
    <div class="ps"><h3>2. Family members attending</h3>
      <table class="pt"><tr><th>Day</th><th>Attending?</th>${A.familyArea.map(f => `<th>${esc(f.label)}</th>`).join("")}<th>${esc(A.venue.label)}</th><th>Total</th></tr>
      ${S.days.map((d, i) => `<tr><td>${esc(E.days[i].short)}</td><td>${d.attending ? "Yes" : "No"}</td>${A.familyArea.map(f => `<td>${d.attending ? d[f.key] : "—"}</td>`).join("")}<td>${d.attending ? d.venue : "—"}</td><td><b>${d.attending ? dayTotal(d) : "—"}</b></td></tr>`).join("")}</table></div>
    <div class="ps"><h3>3–5. Seating needs</h3>
      ${pr("3. Simultaneous translation", n.translation ? `Yes — Punjabi/Hindi to English: ${n.en}; Punjabi/Hindi/English to French: ${n.fr}` : yn(n.translation))}
      ${pr("4. Hearing assistance", n.hearing ? `Yes — ${n.hearingN} member${n.hearingN === 1 ? "" : "s"}` : yn(n.hearing))}
      ${pr("5. Special needs", n.special ? `Yes — ${n.specialN} member${n.specialN === 1 ? "" : "s"} (Special Needs Application Form attached)` : yn(n.special))}</div>
    <div class="ps"><h3>6. Mode of transportation to the Study Centre</h3>
      <div class="pbox"><b>${esc(opt)}</b>${t.mode === "park" ? `<br>Reason for pass: <b>${esc(reason)}</b> &nbsp;·&nbsp; Number of parking spots: <b>${t.parkSpots}</b><br><span style="font-size:8.5pt;color:var(--soft)">Parking space is limited and not all requests may receive a car pass.</span>` : ""}${t.mode === "shuttle" && busChoice() ? ` — <b>${esc(busChoice().name)}</b> (see Section 7)` : ""}${t.mode === "taxi" ? `<br>Pick-up / drop-off address: <b>${DATA.transport.dropOff.address.map(esc).join(" ")}</b><br><span style="font-size:8.5pt;color:var(--soft)">${esc(DATA.transport.dropOff.warning)}</span>` : ""}</div></div>
    ${t.mode === "shuttle" && busChoice() ? (() => { const bc = busChoice(); return `<div class="ps"><h3>7. Study Centre Shuttle Buses — bus ticket order</h3>
      <table class="pt"><tr><th>Day</th><th>Departure location</th><th>Departure time</th><th># of tickets</th><th>Price</th><th>Bus total</th>${bc.parking ? "<th># of cars parking</th>" : ""}</tr>
      ${S.days.map((d, i) => `<tr><td>${esc(E.days[i].short)}</td>${d.attending ? `<td style="text-align:left">${esc(bc.name)}</td><td>${esc(S.bus.days[i].time)} AM</td><td>${S.bus.days[i].tickets}</td><td>${money(bc.price)}</td><td><b>${money(busDayTotal(i))}</b></td>${bc.parking ? `<td>${S.bus.days[i].cars}</td>` : ""}` : `<td colspan="${bc.parking ? 6 : 5}" style="text-align:left;color:var(--soft)">Not attending</td>`}</tr>`).join("")}
      <tr><td colspan="${bc.parking ? 5 : 4}" style="text-align:right">Bus Total (A)</td><td><b>${money(busGrand())}</b></td>${bc.parking ? "<td></td>" : ""}</tr></table>
      <div style="font-size:7.5pt;color:var(--soft);line-height:1.2">${DATA.busNotes.map(esc).join(" ")}</div></div>`; })() : ""}
    <div class="ps"><h3>9–10. Tea &amp; packed lunch · Total payment</h3>
      <div style="display:flex; gap:12pt; align-items:flex-start">
      <table class="pt" style="flex:1"><tr><th>Day</th><th># of Tea (${money(DATA.teaLunch.teaPrice)})</th><th># of Lunch (${money(DATA.teaLunch.lunchPrice)})</th><th>Tea &amp; lunch total</th></tr>
        ${S.days.map((d, i) => `<tr><td>${esc(E.days[i].short)}</td>${d.attending ? `<td>${S.food.days[i].tea}</td><td>${S.food.days[i].lunch}</td><td><b>${money(foodDayTotal(i))}</b></td>` : `<td colspan="3" style="text-align:left;color:var(--soft)">Not attending</td>`}</tr>`).join("")}
        <tr><td colspan="3" style="text-align:right">Tea &amp; Lunch Total (B)</td><td><b>${money(foodGrand())}</b></td></tr></table>
      <table class="pt" style="flex:1"><tr><th colspan="2" style="text-align:left">Total payment enclosed</th></tr>
        ${t.mode === "shuttle" ? `<tr><td>Bus Total (A)</td><td>${money(busA())}</td></tr>` : ""}
        <tr><td>Tea &amp; Lunch Total (B)</td><td>${money(foodGrand())}</td></tr>
        <tr><td><b>Total Payment</b></td><td><b>${money(grandTotal())}</b></td></tr>
        <tr><td>Paying by</td><td style="text-align:left">${grandTotal() > 0 ? `${S.pay.method === "cash" ? "☑" : "☐"} Cash &nbsp; ${S.pay.method === "cheque" ? "☑" : "☐"} Cheque` : "—"}</td></tr></table>
      </div>
      <div style="font-size:7.5pt;color:var(--soft);margin-top:2pt">${esc(DATA.teaLunch.note)} ${t.mode === "shuttle" || grandTotal() > 0 ? "Cheques payable to " + esc(DATA.chequePayableTo) + "." : ""}</div></div>
    <div class="legal"><div><b>Privacy</b>${esc(DATA.legal.privacy)}</div><div><b>Consent</b>${esc(DATA.legal.consent)}</div><div><b>Disclaimer</b>${esc(DATA.legal.disclaimer)}</div></div>
    <div class="sig"><div><div class="l">Signature</div><div class="b"></div></div><div><div class="l">Date (MM/DD)</div><div class="b"><span>, ${esc(E.year)}</span></div></div></div>
    <div class="admin"><div class="cap">For admin use only</div><div class="grid">
      <div>Date received<i></i></div><div>Receiving centre<i></i></div><div>Received by<i></i></div><div>Finance rep(s)<i></i></div><div>Remote<span class="cb"></span></div><div>OOT<span class="cb"></span></div></div></div>
    <div class="pfoot"><span>${esc(DATA.version)} · build ${BUILD.number}${BUILD.preview ? " PREVIEW" : ""} · completed online ${new Date().toLocaleDateString("en-CA")}</span><span>Page 1 of 1</span></div>`;
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function focusKey() {
  const a = document.activeElement; if (!a || !a.dataset) return null;
  if (a.dataset.path) return `[data-path="${a.dataset.path}"]`;
  if (a.dataset.seg) return `[data-seg="${a.dataset.seg}"][data-v="${a.dataset.v}"]`;
  if (a.dataset.step) return `[data-step="${a.dataset.step}"][data-d="${a.dataset.d}"]`;
  if (a.dataset.mode) return `[data-mode="${a.dataset.mode}"]`;
  if (a.dataset.busopt) return `[data-busopt="${a.dataset.busopt}"]`;
  if (a.dataset.busloc) return `[data-busloc="${a.dataset.busloc}"]`;
  if (a.dataset.bustime !== undefined) return `[data-bustime="${a.dataset.bustime}"][data-v="${a.dataset.v}"]`;
  return null;
}
function render() {
  normalize();
  const keep = focusKey();
  const step = steps()[S.step], errs = step.validate();
  $("#preview").innerHTML = BUILD.preview ? `<b>Preview build ${BUILD.number}</b> · for review only, not for real registrations · updated ${BUILD.date}` : "";
  $("#preview").style.display = BUILD.preview ? "" : "none";
  $("#ev-title").textContent = E.title;
  $("#ev-dates").textContent = `${dayName(D1)} & ${dayName(D2)} ${E.year}`;
  $("#progress").innerHTML = steps().map((s, i) => `<span class="${i < S.step ? "done" : i === S.step ? "cur" : ""}"></span>`).join("");
  $("#stepname").textContent = step.name;
  $("#stepcount").textContent = `Step ${S.step + 1} of ${steps().length}`;
  const banner = restored && S.step === 0 ? `<div class="banner">We restored the draft you started on this device. <button class="btn" data-startover="1">Start over</button></div>` : "";
  $("#main").innerHTML = banner + R[step.key](errs);
  const last = S.step === steps().length - 1;
  $("#navbtns").innerHTML = `${S.step > 0 ? `<button class="btn" data-nav="-1">Back</button>` : `<button class="btn ghost" data-startover="1">Start over</button>`}
    ${last ? `<button class="btn primary" data-print="1" ${Object.keys(allErrors()).length ? "disabled" : ""}>Print / Save as PDF</button>` : `<button class="btn primary" data-nav="1">Continue</button>`}`;
  if (keep) { const el = document.querySelector(keep); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  save();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, a");
  if (!b) return;
  if (b.dataset.nav) {
    const d = +b.dataset.nav;
    if (d > 0) { const errs = steps()[S.step].validate(); if (Object.keys(errs).length) { touchAll(errs); render(); const f = $(".f.bad, .day .msg, [data-f].bad"); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" }); return; } }
    S.step = Math.max(0, Math.min(steps().length - 1, S.step + d)); restored = false; window.scrollTo(0, 0); render();
  }
  else if (b.dataset.goto !== undefined) { e.preventDefault(); S.step = +b.dataset.goto; const errs = steps()[S.step].validate(); touchAll(errs); render(); const f = b.dataset.focus ? $(`[data-f="${b.dataset.focus}"]`) : null; if (f) f.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0); }
  else if (b.dataset.seg) { set(b.dataset.seg, JSON.parse(b.dataset.v)); touch(b.dataset.key); render(); }
  else if (b.dataset.step) { const p = b.dataset.step, inp = $(`input[data-path="${p}"]`); const v = Math.max(+inp.dataset.min, Math.min(+inp.dataset.max, (+get(p) || 0) + +b.dataset.d)); set(p, v); touch(b.dataset.key); render(); }
  else if (b.dataset.mode) { set("transport.mode", b.dataset.mode); touch("mode"); render(); }
  else if (b.dataset.busopt) { S.bus.option = b.dataset.busopt; touch("busopt"); render(); }
  else if (b.dataset.busloc) { S.bus.location = b.dataset.busloc; touch("busloc"); render(); }
  else if (b.dataset.bustime !== undefined) { S.bus.days[+b.dataset.bustime].time = b.dataset.v; touch("bt" + b.dataset.bustime); render(); }
  else if (b.dataset.startover) { if (confirm("Clear everything you have entered and start a new form?")) { try { localStorage.removeItem(KEY); } catch (e) {} S = blank(); restored = false; render(); window.scrollTo(0, 0); } }
  else if (b.dataset.print) { renderSheet(); window.print(); }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.path) return;
  let v = el.value;
  if (el.dataset.mask === "phone") { v = fmtPhone(v); el.value = v; }
  if (el.dataset.mask === "postal") { v = fmtPostal(v); el.value = v; }
  if (el.dataset.num) { v = Math.max(+el.dataset.min, Math.min(+el.dataset.max, parseInt(digits(v) || "0", 10))); }
  set(el.dataset.path, v);
  if (el.dataset.num) { touch(el.dataset.key); render(); return; }
  paint(el.dataset.key);
  save();
});
document.addEventListener("focusout", e => {
  const el = e.target; if (!el.dataset || !el.dataset.key || el.dataset.num) return;
  touch(el.dataset.key); paint(el.dataset.key); save();
});
document.addEventListener("change", e => { const el = e.target; if (el.tagName === "SELECT" && el.dataset.path) { set(el.dataset.path, el.value); touch(el.dataset.key); paint(el.dataset.key); save(); } });
window.addEventListener("beforeprint", renderSheet);

render();
</script>
</body>
</html>
